# scrumbs.conf -- shared settings for crumbloop.sh (capture) and sweep.sh
# (cull / dedupe / compress), sourced by both. Edit by hand, or tune the
# bands line with crumbudget.html and paste it in.

path="$HOME/scrumbs"     # where all the screenshots live

# Age bands, young to old, as "<max-age>:<keep-period>" pairs.
# A screenshot whose age lands in a band gets culled down to one screenshot
# per keep-period. Duration units: s, m, h, d, w, y.
# Two values are derived from this line rather than configured separately:
# the first band's keep-period is the capture loop's frequency, and the last
# band's max-age is the horizon -- anything older gets deleted.
# bands="1h:5s 1d:1m 7d:5m 30d:1h 1y:1d"
bands="1h:3s 1d:10s 7d:30s 30d:1m 1y:10m"

sweepevery="5m"          # how often crumbloop.sh spawns sweep.sh

imgq=20                  # webp quality for archived images; see gensamples.sh
fuzz="4%"                # per-pixel fuzz factor when comparing images
dedupethresh=1000        # differing pixels (after fuzz) below which two
                         # captures count as identical; absorbs menu-bar
                         # clock ticks (~120-200px) but also a change as
                         # small as a single typed character
